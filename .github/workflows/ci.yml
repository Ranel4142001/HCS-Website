name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
# The job only reads the code, so its token gets read access and nothing else
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint (includes architecture rules)
        run: npm run lint
      - name: Build
        run: npm run build
